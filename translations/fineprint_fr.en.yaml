terms:
    scope:
        title: 'Scope'
        body: 'These terms of sale govern the sales of products and services made on %site% between %seller% (“the seller”) and its clients. Placing an order means accepting the terms in force on the day of the order.'
    audience:
        b2b: 'Sales are reserved for businesses acting for the purposes of their trade.'
        b2c: 'Sales are made to consumers.'
        both: 'Sales are made to consumers and businesses alike; clauses specific to either say so.'
    seller:
        body: 'The seller''s identity and contact details are given in the'
    marketplace:
        title: 'Marketplace'
        body: |
            %site% also connects buyers with third-party sellers. When an offer comes from a third-party seller, the contract of sale is concluded directly between the buyer and that seller, who is then “the seller” within these terms.

            Each offer states whether the seller is a business or a private individual. When the seller is a private individual, the rights the French Consumer Code gives consumers do not apply to the contract made with them. Main parameters ranking the offers: %ranking% (French Consumer Code, article L111-7).
    order:
        title: 'Ordering'
        body: 'The client chooses the products or services, checks the order''s details and total price, corrects any errors, then confirms the order. The order is final once payment is accepted. The seller acknowledges it without delay by electronic means.'
    price:
        title: 'Prices and payment'
        b2b: 'Prices are in euros, excluding VAT; VAT at the applicable rate is added when ordering.'
        b2c: 'Prices are in euros, including all taxes.'
        both: 'Prices are in euros. For consumers they include all taxes; for businesses, VAT at the applicable rate is added to the prices excluding VAT.'
        vat_exempt: 'Prices are in euros. VAT not applicable, article 293 B of the French General Tax Code.'
    payment:
        body: 'Payment is due when ordering. It is made online, by the means offered at checkout.'
        provider: 'Payments are processed by the payment provider %provider%.'
        late: 'For business clients, any late payment automatically incurs penalties at three times the French statutory interest rate and a fixed recovery fee of €40 (French Commercial Code, articles L441-10 and D441-5).'
    digital:
        title: 'Digital services'
        body: 'Digital services are provided online. Access may be briefly interrupted for maintenance, updates or security reasons.'
        client: 'The client uses the services for their intended purpose and in accordance with the law, and keeps its login details confidential.'
    services:
        title: 'Services'
        body: 'Services are performed as described in the order accepted by the client, within the time stated in it. The client provides in good time the information needed to perform them.'
        means: 'Towards business clients, the seller is bound by an obligation of means.'
    delivery:
        title: 'Delivery'
        body: 'Goods are delivered to the address given when ordering, within the time stated before the order.'
        consumers: 'For consumers, if no time was stated, goods are delivered no later than thirty days after the contract is concluded. Failing delivery in time, the consumer may, after asking the seller to deliver within a reasonable additional period, terminate the contract. The risk of loss or damage passes to the consumer when the consumer, or a third party the consumer designated other than the carrier offered by the seller, takes physical possession of the goods (French Consumer Code, articles L216-1 et seq.).'
    subscription:
        title: 'Subscriptions'
        body: 'A subscription is taken out for the period stated when ordering and renews automatically for the same period unless cancelled. Any price change is announced to the client before the renewal. The client may cancel at any time: cancellation takes effect at the end of the current period, already paid, with no refund of the period started.'
        how: 'To cancel: %cancellation%'
        consumers: 'Consumers can cancel online, through the function provided for that purpose (French Consumer Code, article L215-1-1). For a fixed-term subscription renewed automatically, the seller informs the consumer, no earlier than three months and no later than one month before the end of the period, of the option not to renew it (article L215-1 of the same code).'
    withdrawal:
        title: 'Right of withdrawal'
        body: 'Consumers have fourteen days to withdraw, without giving reasons or paying penalties (French Consumer Code, articles L221-18 et seq.). The period runs from the conclusion of the contract for a service or digital content, and from receipt for goods. To withdraw, the consumer sends the seller, before the period ends, an unequivocal statement, for instance by email to %email% or with the form below. The seller refunds all sums paid no later than fourteen days after being informed of the decision, using the means of payment used for the order.'
        goods: 'For goods, the consumer sends them back no later than fourteen days after communicating the decision; return costs are borne by the consumer.'
        partial: 'If the consumer asked for a service to start during the withdrawal period and withdraws before it is completed, the consumer pays an amount in proportion to what was provided until the withdrawal (French Consumer Code, article L221-25).'
        waiver: 'Under article L221-28 of the French Consumer Code, the right of withdrawal cannot be exercised for a service fully performed before the end of the withdrawal period, nor for digital content not supplied on a tangible medium, when performance began with the consumer''s prior express consent and the consumer acknowledged losing the right of withdrawal. This consent and acknowledgement are collected when ordering.'
        businesses_only: 'As sales are made between businesses, the right of withdrawal under the French Consumer Code does not apply, except in the case set out in article L221-3 of that code.'
        businesses_also: 'Business clients do not have this right of withdrawal, except in the case set out in article L221-3 of the French Consumer Code.'
    withdrawal_form:
        title: 'Withdrawal form'
        to: 'To:'
        body: 'I/We (*) hereby give notice that I/We (*) withdraw from my/our (*) contract of sale of the following goods (*)/for the provision of the following service (*):'
        ordered: 'Ordered on (*)/received on (*):'
        name: 'Name of consumer(s):'
        address: 'Address of consumer(s):'
        signature: 'Signature of consumer(s) (only if this form is notified on paper):'
        date: 'Date:'
        strike: '(*) Delete as appropriate.'
    guarantees:
        title: 'Legal guarantees'
        goods: 'For goods, consumers benefit from the legal guarantee of conformity for two years from delivery (French Consumer Code, articles L217-3 et seq.) and from the guarantee against hidden defects (French Civil Code, articles 1641 et seq.).'
        digital: 'For digital content and services, they benefit from the legal guarantee of conformity of articles L224-25-12 et seq. of the French Consumer Code.'
        how: 'They can invoke these guarantees by writing to %email%.'
    liability:
        title: 'Liability'
        body: 'Towards business clients, the seller''s liability is limited to the amount paid for the order concerned, and the seller is not liable for indirect damage (including loss of revenue, customers or data). These limits apply neither in case of gross negligence or wilful misconduct, nor to consumers, whose statutory rights remain in full.'
    personal_data:
        title: 'Personal data'
        body: 'The data needed to process orders is handled as described in the'
    mediation:
        title: 'Mediation'
        body: 'In case of dispute, consumers may refer free of charge to the consumer mediator the seller belongs to, after sending the seller a written complaint (French Consumer Code, articles L612-1 et seq.):'
    law:
        title: 'Governing law and disputes'
        body: 'These terms are governed by the law of %law%. The parties first seek an amicable solution.'
        court: 'For business clients, failing an amicable solution, any dispute falls under the exclusive jurisdiction of the courts of %court%.'
        consumers: 'Consumers may bring proceedings, at their choice, before any court with territorial jurisdiction or the court of the place where they lived when the contract was concluded or the harmful event occurred (French Consumer Code, article R631-3).'

privacy:
    intro: 'This page explains which personal data %site% processes, for what purposes, for how long, and how to exercise your rights, under Regulation (EU) 2016/679 (GDPR) and French law no. 78-17 of 6 January 1978 (Informatique et Libertés).'
    controller: { title: 'Data controller' }
    processing:
        title: 'Processing activities'
        data: 'Data'
        basis: 'Legal basis'
        interest: 'Legitimate interest pursued'
        retention: 'Retention period'
        processors: 'Processors'
    basis:
        consent: 'Your consent (GDPR, article 6(1)(a)), which you may withdraw at any time'
        contract: 'The performance of a contract, or of steps taken at your request before entering into one (GDPR, article 6(1)(b))'
        legal_obligation: 'Compliance with a legal obligation (GDPR, article 6(1)(c))'
        vital_interests: 'Protecting your vital interests or those of another person (GDPR, article 6(1)(d))'
        public_task: 'The performance of a task carried out in the public interest (GDPR, article 6(1)(e))'
        legitimate_interests: 'Our legitimate interests (GDPR, article 6(1)(f))'
    role:
        hosting: 'hosting'
        email: 'sending emails'
        payment: 'online payment'
        ai: 'artificial intelligence processing'
        analytics: 'audience measurement'
        other: 'technical provider'
    processors:
        title: 'Processors'
        intro: 'The following providers process data on our behalf, following our instructions:'
        transfer: 'Transfer outside the European Economic Area, framed by:'
    rights:
        title: 'Your rights'
        body: |
            You have the right to access, rectify and erase your data, to restrict or object to its processing, and to data portability (GDPR, articles 15 to 21). Where processing rests on your consent, you may withdraw it at any time, without affecting the processing carried out before. You may also set instructions for what happens to your data after your death (French law Informatique et Libertés, article 85).

            To exercise these rights, write to %contact%. We answer within one month, which may be extended by two months for a complex request. If we have reasonable doubts about your identity, we may ask for proof.
    complaint:
        title: 'Complaints'
        body: 'If you believe your rights are not respected, you may lodge a complaint with the French data protection authority, the Commission nationale de l''informatique et des libertés (CNIL), 3 place de Fontenoy, TSA 80715, 75334 Paris Cedex 07, France, www.cnil.fr.'
    cookies:
        title: 'Cookies'
        body: 'The cookies the site sets are described on the page'

cookies:
    intro: |
        A cookie is a small file stored on your device when you visit a site. This page lists the ones %site% uses.

        Cookies strictly necessary for the site to work, or for a service you explicitly ask for, are exempt from consent (French law Informatique et Libertés, article 82). Others are set only with your consent, which you may withdraw at any time, as easily as you gave it.
    list:
        title: 'Cookies on this site'
        none: 'This site sets no cookies.'
        only_essential: 'This site only uses strictly necessary cookies: no consent is asked of you.'
        consent: 'Cookies that are not strictly necessary are set only after your consent.'
        name: 'Name'
        purpose: 'Purpose'
        type: 'Category'
        duration: 'Duration'
        manage: 'You can change your choices at any time:'
        manage_link: 'manage my cookies'
    type:
        essential: 'Strictly necessary'
        preferences: 'Preferences'
        analytics: 'Audience measurement'
        marketing: 'Advertising'
    browser:
        title: 'Browser settings'
        body: 'You can also block or delete cookies in your browser''s settings. Blocking strictly necessary cookies may prevent some features of the site from working, such as signing in or sending forms.'
