# Pack "eu", in English. Generic wording for any EU member state, citing EU law only:
# the site states its governing law and country. Every fact comes from its configuration.
page:
    legal_notice: { title: 'Legal notice', link: 'Legal notice', link_inline: 'legal notice', description: 'Legal notice of %site%: provider, contact and hosting.' }
    terms: { title: 'Terms of sale', link: 'Terms of sale', link_inline: 'terms of sale', description: 'Terms of sale of %site%: ordering, prices, payment, withdrawal, liability and disputes.' }
    privacy: { title: 'Privacy policy', link: 'Privacy', link_inline: 'privacy policy', description: 'How %site% processes your personal data: purposes, legal bases, retention periods, processors and your rights.' }
    cookies: { title: 'Cookies', link: 'Cookies', link_inline: 'cookies', description: 'The cookies %site% uses, what they are for and how to refuse them.' }

